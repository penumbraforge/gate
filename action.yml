name: 'Gate Security Scanner'
description: 'Detect and remediate secrets in pull requests and pushes. Free, open source.'
author: 'PenumbraForge'

inputs:
  mode:
    description: 'enforce (block on findings) or report (just log)'
    required: false
    default: 'report'
  verify:
    description: 'Verify if detected credentials are live (true/false)'
    required: false
    default: 'false'
  format:
    description: 'Output format: text, json, sarif'
    required: false
    default: 'text'
  fail-on:
    description: 'Minimum severity to fail: critical, high, medium, low'
    required: false
    default: 'high'
  failure-mode:
    description: 'How to treat findings or scan errors: block or warn'
    required: false
  slack-webhook:
    description: 'Slack webhook URL for notifications'
    required: false
  github-token:
    description: 'GitHub token for PR comments'
    required: false
    default: ${{ github.token }}
  use-local:
    description: 'Run the checked-out repo''s own CLI (node bin/gate.js) instead of installing @penumbraforge/gate from npm. Used for self-testing unreleased versions.'
    required: false
    default: 'false'

outputs:
  findings-count:
    description: 'Number of findings detected'
  blocked:
    description: 'Whether the action blocked the commit'
  scan-report:
    description: 'JSON scan report'

runs:
  using: 'node24'
  main: 'github-action/dist/index.js'

branding:
  icon: 'shield'
  color: 'red'
