name: Release

# Publishes to npm when a v* tag is pushed. Uses OIDC trusted publishing —
# no npm token is stored. Configure Gate as a trusted publisher for this
# workflow on npmjs.com first.
on:
  push:
    tags:
      - 'v*'
  # Manual re-run: after configuring the npm trusted publisher, run this from
  # the Actions tab (or `gh workflow run release.yml`) without re-tagging.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance / OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs a recent npm.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build the action bundle
        run: npm run build:action

      - name: Verify docs are in sync
        run: node scripts/gen-docs.js --check

      - name: Publish to npm
        run: npm publish --provenance --access public
